[package]
name = "mail-notify"
version = "0.1.0"
edition = "2021"
description = "IMAP IDLE watcher that sends desktop notifications for new Gmail"

[dependencies]
imap = "3.0.0-alpha.15"
native-tls = "0.2"
dotenvy = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
